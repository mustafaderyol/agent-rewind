[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rewind"
version = "0.2.0"
description = "Zero-Trust Transactional Rollback, Outbox Buffering & MCP Auto-Discovery Runtime for AI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mustafa Deryol" }
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "transactions",
    "saga-pattern",
    "rollback",
    "compensation",
    "prompt-injection",
    "outbox",
    "llm-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk>=1.2.3",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.17",
    "mcp>=2.3.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/mustafaderyol/agent-rewind"
Repository = "https://github.com/mustafaderyol/agent-rewind"
Documentation = "https://github.com/mustafaderyol/agent-rewind/tree/main/docs"
Wiki = "https://github.com/mustafaderyol/agent-rewind/wiki"
Issues = "https://github.com/mustafaderyol/agent-rewind/issues"
Changelog = "https://github.com/mustafaderyol/agent-rewind/blob/main/CHANGELOG.md"

[project.optional-dependencies]
rich = ["rich>=13.7.0"]
http = ["httpx>=0.27.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rewind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
